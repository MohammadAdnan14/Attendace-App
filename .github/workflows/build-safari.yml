name: Build Safari Extension (.app)

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "safari-extension/RBU-Attendance-Planner-macOS.zip"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Compile & Sign macOS Safari Extension (.app)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean WebExtension source (exclude nested .zip archives)
        run: |
          rm -rf safari-src
          cp -R safari-extension safari-src
          rm -f safari-src/*.zip

      - name: Convert Web Extension to Xcode Project
        run: |
          mkdir -p SafariApp
          yes | xcrun safari-web-extension-converter safari-src \
            --app-name "RBUAttendancePlanner" \
            --bundle-identifier "com.rbu.RBUAttendancePlanner" \
            --swift \
            --macos-only \
            --copy-resources \
            --no-open \
            --project-location "$GITHUB_WORKSPACE/SafariApp"

      - name: Inspect generated Xcode project
        run: |
          PROJECT_PATH=$(find SafariApp -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "Detected project at: $PROJECT_PATH"
          xcodebuild -project "$PROJECT_PATH" -list

      - name: Build macOS App Bundle
        run: |
          xcodebuild -project "$PROJECT_PATH" \
            -scheme "RBUAttendancePlanner" \
            -configuration Release \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Clean, Ad-Hoc Sign (_CodeSignature), and Package macOS .app
        run: |
          APP_PATH=$(find derived_data/Build/Products/Release -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app at: $APP_PATH"

          # 1. Remove any redundant .zip files from Resources
          rm -f "$APP_PATH/Contents/PlugIns/"*.appex/Contents/Resources/*.zip
          rm -f "$APP_PATH/Contents/Resources/"*.zip

          # 2. Ad-hoc sign inner .appex extension bundle(s) first
          for appex in "$APP_PATH/Contents/PlugIns/"*.appex; do
            echo "Signing extension: $appex"
            codesign --force --sign - "$appex"
          done

          # 3. Ad-hoc sign the outer .app bundle deeply (generates _CodeSignature)
          echo "Signing host app: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"

          # 4. Verify signature and _CodeSignature presence
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ls -la "$APP_PATH/Contents/_CodeSignature"

          # 5. Package into a single clean macOS zip using Apple's ditto utility
          rm -f "$GITHUB_WORKSPACE/safari-extension/RBU-Attendance-Planner-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/safari-extension/RBU-Attendance-Planner-macOS.zip"
          cp "$GITHUB_WORKSPACE/safari-extension/RBU-Attendance-Planner-macOS.zip" "$GITHUB_WORKSPACE/RBU-Attendance-Planner-macOS.zip"

      - name: Commit ready-built macOS .app zip to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add safari-extension/RBU-Attendance-Planner-macOS.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(safari): update signed macOS RBUAttendancePlanner.app bundle [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to macOS app bundle."
          fi

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBU-Attendance-Planner-macOS
          path: RBU-Attendance-Planner-macOS.zip
          retention-days: 14
