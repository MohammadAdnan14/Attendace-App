name: Build Safari Extension (.app)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Compile macOS Safari Extension (.app)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert Web Extension to Xcode Project
        run: |
          mkdir -p SafariApp
          yes | xcrun safari-web-extension-converter iOS-extension-updated \
            --app-name "RBU Attendance Planner" \
            --bundle-identifier "com.rbu" \
            --swift \
            --macos-only \
            --copy-resources \
            --no-open \
            --project-location "$GITHUB_WORKSPACE/SafariApp"

      - name: Inspect and Fix Bundle Identifiers
        run: |
          PROJECT_PATH=$(find SafariApp -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "Detected project at: $PROJECT_PATH"

          PBXPROJ="$PROJECT_PATH/project.pbxproj"
          # Get parent app bundle identifier
          PARENT_BUNDLE_ID=$(grep -E 'PRODUCT_BUNDLE_IDENTIFIER = com\.' "$PBXPROJ" | grep -v 'Extension' | head -n 1 | awk '{print $3}' | tr -d '";')
          echo "Parent Bundle Identifier: $PARENT_BUNDLE_ID"
          if [ -n "$PARENT_BUNDLE_ID" ]; then
            # Ensure the extension's bundle identifier is strictly prefixed by the parent app's identifier
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*\.Extension;/PRODUCT_BUNDLE_IDENTIFIER = \"${PARENT_BUNDLE_ID}.Extension\";/g" "$PBXPROJ"
          fi

          xcodebuild -project "$PROJECT_PATH" -list

      - name: Build macOS App Bundle
        run: |
          # Automatically detect the exact scheme name from xcodebuild -list
          SCHEME=$(xcodebuild -project "$PROJECT_PATH" -list | awk '/Schemes:/{flag=1; next} flag && /^[[:space:]]*[^[:space:]]/{gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="RBU Attendance Planner"
          fi
          echo "Using scheme: '$SCHEME'"

          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package macOS .app into Zip
        run: |
          APP_PATH=$(find derived_data/Build/Products/Release -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          cd "$APP_DIR"
          zip -r "RBU-Attendance-Planner-macOS.zip" "$APP_NAME"
          mv "RBU-Attendance-Planner-macOS.zip" "$GITHUB_WORKSPACE/"

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBU-Attendance-Planner-macOS
          path: RBU-Attendance-Planner-macOS.zip
          retention-days: 14
